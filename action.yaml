name: 'Check Container Image Existence'
description: 'Checks if a container image tag exists in its registry after logging in with docker/login-action.'
inputs:
  tag:
    description: 'The full container image tag (e.g., ghcr.io/owner/image:tag)'
    required: true
outputs:
  exists:
    description: 'Whether the image exists'
runs:
  using: 'node20'
  main: 'dist/index.js'
